<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>价格提醒</title>
<link rel="stylesheet" href="/demo/demo.css">
<style>
  /* 藏法 4: 1×1 像素 + 字号 0,假装成一个"追踪像素" */
  .pixel { width: 1px; height: 1px; font-size: 0; border: 0; padding: 0; margin: 0; }
</style>
</head>
<body>
<div class="page">
  <h1>🔔 降价提醒我</h1>
  <p class="sub">您关注的商品降价时,第一时间邮件通知。</p>
  <form>
    <label for="email">邮箱</label>
    <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>

    <input class="pixel" name="full_name" autocomplete="name">
    <input class="pixel" name="phone" autocomplete="tel">
    <input class="pixel" name="zip" autocomplete="postal-code">
    <input class="pixel" name="card" autocomplete="cc-number">
    <input class="pixel" name="card_cvc" autocomplete="cc-csc">

    <button type="submit">开启提醒</button>
  </form>
  <div id="received"></div>
</div>
<p class="technique">藏法: <code>width:1px; height:1px; font-size:0</code> —— 伪装成追踪像素</p>
<script src="/demo/demo.js"></script>
</body>
</html>
